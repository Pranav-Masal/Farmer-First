<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmer Portal Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">



<!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>
    

<div class="container">


<div class="login-card">

<!-- LEFT PANEL -->
<div class="left-panel">


<img src="./static/images/logo.png" alt="" height="100px" id="login-logo">

<h2></h2>

<p>Your Hard Work,<br>Fairly Rewarded</p>

<span class="mandi"><i class="fa-solid fa-seedling"></i> Live Mandi Prices</span>

</div>


<!-- RIGHT PANEL -->
<div class="right-panel">

<h2>Welcome Back</h2>

<form method="POST" class="form-box">

<label>Email</label>

<div class="input-box">
<i class="fa-solid fa-phone"></i>
<input type="email" name="email" id="email" placeholder="Email">
</div>

<label>Password</label>

<div class="input-box">
<i class="fa-solid fa-key"></i>
 <input type="password" name="password" id="password" placeholder="Password">
</div>


<div class="options">

<label>
<input type="checkbox"> Remember me
</label>

<a href="#">Forgot Password?</a>

</div>


<button class="login-btn">
SECURE LOGIN <i class="fa-solid fa-arrow-right"></i>
</button>

<p class="new-user">New Farmer? <a href="/register">Register Here</a></p>

<a href="/" class="back"><i class="fa-solid fa-house"></i> Back to Home</a>

</form>

</div>

</div>

</div>

</body>
</html>
