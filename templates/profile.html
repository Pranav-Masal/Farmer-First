<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
<title>Farmer Profile</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

<div class="container">
  <!-- PROFILE HEADER -->
  <div class="profile-header">

<h2>{{ user.name }}</h2>

<div class="info">

<p><b>Email :</b> {{ user.email }}</p>

<p><b>Role :</b> {{ user.role }}</p>

</div>

</div>

  <!-- ADD PRODUCT -->
  <div class="form-box">
    <h3>Add Product</h3>
    <form action="/add_product" method="POST" enctype="multipart/form-data">
      <input type="text" name="farmer_name" placeholder="Farmer Name" required>
      <input type="text" name="address" placeholder="Address" required>
      <input type="text" name="phone" placeholder="Phone Number" required>
      <input type="text" name="name" placeholder="Product Name" required>
      <input type="number" name="price" placeholder="Price" required>
      <input type="number" name="quantity" placeholder="Quantity" required>
      <input type="text" name="description" placeholder="Description" required>

      <label class="upload-btn">
        Upload Product Image
        <input type="file" name="image" id="imageInput" accept="image/*" required>
      </label>

      <img id="preview" class="preview-img">

      <button type="submit" class="add-btn">Add Product</button>
    </form>
  </div>

 <!-- PRODUCTS -->

<h3 class="product-title">Your Products</h3>
<div class="products">
  {% for p in products %}
  <div class="product-card">
    {% if p.image %}
    <img src="{{ url_for('static', filename='uploads/' + p.image) }}">
    {% else %}
    <img src="{{ url_for('static', filename='images/default.png') }}">
    {% endif %}

    <h4>{{ p.name }}</h4>
    <p>₹ {{ p.price }}</p>
    <p>Qty : {{ p.quantity }}</p>

    <!-- Delete button -->
    <form action="{{ url_for('delete_product', product_id=p._id) }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this product?');">
        <button type="submit" class="delete-btn">Delete</button>
    </form>
  </div>
  {% endfor %}
</div>

<!--back button-->
<a href="{{ url_for('dashboard') }}" class="back-btn">
← Back to Home
</a>


<script>
// File preview
let imageInput = document.getElementById("imageInput");
let preview = document.getElementById("preview");
imageInput.onchange = evt => {
  const [file] = imageInput.files
  if(file){
    preview.src = URL.createObjectURL(file)
    preview.style.display="block"
  }
}
</script>

</body>
</html>
