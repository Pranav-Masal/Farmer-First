<!DOCTYPE html>
<html>
<head>

<title>Farmers</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b,#020617);
min-height:100vh;
color:white;
}

/* TITLE */

.title{
text-align:center;
padding:40px;
font-size:38px;
font-weight:700;
letter-spacing:2px;
background:linear-gradient(90deg,#22c55e,#4ade80,#16a34a);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* GRID */

.container{
width:90%;
margin:auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:35px;
padding-bottom:40px;
}

/* CARD */

.card{
background:rgba(255,255,255,0.05);
border-radius:20px;
padding:35px 25px;
text-align:center;
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,0.1);
transition:0.5s;
position:relative;
overflow:hidden;
}

/* CARD HOVER */

.card:hover{
transform:translateY(-12px) scale(1.03);
box-shadow:0 25px 60px rgba(0,0,0,0.6);
}

/* CARD GLOW EFFECT */

.card::before{
content:"";
position:absolute;
width:200%;
height:200%;
background:linear-gradient(120deg,transparent,rgba(34,197,94,0.3),transparent);
top:-50%;
left:-50%;
transform:rotate(25deg);
opacity:0;
transition:0.5s;
pointer-events:none;
}

.card:hover::before{
opacity:1;
}

/* IMAGE */

.card img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:4px solid #22c55e;
transition:0.4s;
}

.card:hover img{
transform:scale(1.1);
box-shadow:0 0 30px #22c55e;
}

/* NAME */

.name{
font-size:22px;
font-weight:700;
margin-top:12px;
}

/* INFO */

.info{
margin-top:6px;
color:#cbd5f5;
font-size:15px;
}

/* CURRENT STARS */

.star{
color:#64748b;
font-size:20px;
margin:3px;
}

.star.active{
color:#facc15;
text-shadow:0 0 10px #facc15;
}

/* RATE STARS */

.rate-stars{
margin-top:10px;
}

.rate-stars a{
text-decoration:none;
}

.rate-stars .star{
cursor:pointer;
}

/* HOME BUTTON */

.topbar{
display:flex;
justify-content:center;
padding:40px;
}

.home-btn{
background:linear-gradient(135deg,#22c55e,#16a34a);
padding:12px 28px;
border-radius:12px;
color:white;
text-decoration:none;
font-weight:600;
font-size:15px;
transition:0.4s;
box-shadow:0 8px 25px rgba(34,197,94,0.4);
}

.home-btn:hover{
transform:translateY(-4px);
box-shadow:0 15px 40px rgba(34,197,94,0.6);
}

</style>

</head>

<body>

<div class="title">🌾 Our Farmers</div>

<div class="container">

{% for farmer in farmers %}

<div class="card">

{% if farmer.photo %}
<img src="{{ url_for('static', filename='uploads/' + farmer.photo) }}">
{% else %}
<img src="{{ url_for('static', filename='images/default.png') }}">
{% endif %}

<div class="name">{{ farmer.name }}</div>

<div class="info">📞 {{ farmer.phone }}</div>

<div class="info">📍 {{ farmer.address }}</div>

<br>

<!-- CURRENT RATING -->

<div>

{% for i in range(1,6) %}

{% if farmer.rating >= i %}
<i class="fa fa-star star active"></i>
{% else %}
<i class="fa fa-star star"></i>
{% endif %}

{% endfor %}

</div>

<!-- GIVE RATING -->

<div class="rate-stars">

<a href="/rate/{{ farmer._id }}/1"><i class="fa fa-star star"></i></a>
<a href="/rate/{{ farmer._id }}/2"><i class="fa fa-star star"></i></a>
<a href="/rate/{{ farmer._id }}/3"><i class="fa fa-star star"></i></a>
<a href="/rate/{{ farmer._id }}/4"><i class="fa fa-star star"></i></a>
<a href="/rate/{{ farmer._id }}/5"><i class="fa fa-star star"></i></a>

</div>

</div>

{% endfor %}

</div>

<div class="topbar">
<a href="/" class="home-btn">
<i class="fa fa-home"></i> Home
</a>
</div>

</body>
</html>
