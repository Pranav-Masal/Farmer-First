<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Farmer First</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/shop_now.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="container">

<h1>Fresh Products</h1>

<div class="categories">

<button class="cat-btn active" onclick="filterProducts('all',this)">
All
</button>

<button class="cat-btn" onclick="filterProducts('vegetable',this)">
Vegetables
</button>

<button class="cat-btn" onclick="filterProducts('fruit',this)">
Fruits
</button>

</div>

<div class="products">

{% for p in products %}

<div class="card" data-category="{{ p.category }}">

{% if p.image %}
<img src="{{ url_for('static', filename='uploads/' + p.image) }}">
{% else %}
<img src="{{ url_for('static', filename='images/default.png') }}">
{% endif %}

<h3>{{ p.name }}</h3>

<p class="price">₹ {{ p.price }}/kg</p>

<p><i class="fa fa-user"></i> {{ p.farmer_name }}</p>

<p><i class="fa fa-phone"></i> {{ p.phone }}</p>

<button>Shop Now</button>

</div>

{% endfor %}

</div>
</div>

<script src="{{ url_for('static', filename='js/shop_now.js') }}"></script>

</body>
</html>
