<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmer Register</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', system-ui, sans-serif;
}

/* DARK BACKGROUND */
body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
 background:linear-gradient(135deg,#0f172a,#1e293b,#020617);
}

/* GLASS CARD */
.register-card{
  width:480px;
  padding:40px 35px;
  border-radius:20px;
   background:linear-gradient(135deg,#0f172a,#1e293b,#020617);
  backdrop-filter: blur(20px);
  border:1px solid rgba(255,255,255,0.1);
  box-shadow: 0 20px 40px rgba(0,0,0,0.7);
  color:#ffffffcc;
  overflow:hidden;
  position:relative;
  transition:0.3s;
}


.register-card:hover{
    transform:translateY(-5px);
}

/* TITLE */
.register-card h2{
  text-align:center;
  margin-bottom:35px;
  font-weight:700;
  font-size:1.7rem;
  letter-spacing:1px;
  
    color: #22c55e;;
}

/* FORM LAYOUT */
form{
  display:flex;
  flex-direction: column;
  gap:20px;
}

/* TWO COLUMN ROW */
.row{
  display:flex;
  gap:15px;
}

.row .input-group{
  flex:1;
}

/* INPUT GROUP */
.input-group{
  position:relative;
}

.input-group input,
.input-group textarea{
  width:100%;
  padding:14px 14px 14px 40px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.05);
  color:white;
  font-size:14px;
  outline:none;
  transition:0.3s;
}

.input-group textarea{
  resize:none;
  height:70px;
}

.input-group label{
  position:absolute;
  top:50%;
  left:40px;
  transform:translateY(-50%);
  color: #ffffff88;
  font-size:14px;
  pointer-events:none;
  transition:0.3s;
  padding:0 2px;
}

.input-group input:focus + label,
.input-group input:not(:placeholder-shown) + label,
.input-group textarea:focus + label,
.input-group textarea:not(:placeholder-shown) + label{
  top:-10px;
  left:10px;
  font-size:12px;
  color:#4db6ac;
  background: rgba(0,0,0,0.2);
}

/* ICONS */
.input-group i{
  position:absolute;
  top:50%;
  left:12px;
  transform:translateY(-50%);
  color:#ffffff66;
  transition:0.3s;
}

.input-group input:focus ~ i,
.input-group textarea:focus ~ i{
  color:#4db6ac;
}

/* FILE UPLOAD */
.file-upload{
  border:2px dashed rgba(255,255,255,0.2);
  padding:20px;
  border-radius:14px;
  text-align:center;
  cursor:pointer;
  transition:0.3s;
  color:#ffffffaa;
  position:relative;
}

.file-upload:hover{
  border-color:#4db6ac;
  background: rgba(255,255,255,0.05);
  box-shadow:0 12px 30px rgba(34,197,94,0.7);
}

.file-upload input{
  position:absolute;
  width:100%;
  height:100%;
  top:0; left:0;
  opacity:0;
  cursor:pointer;
}

#file-preview{
  margin-top:10px;
  max-width:100%;
  max-height:120px;
  border-radius:8px;
  object-fit:cover;
  display:none;
  border:1px solid rgba(255,255,255,0.15);
}

/* BUTTON */
button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;
 background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(34,197,94,0.7);
}

/* FOOTER */
.footer{
  text-align:center;
  margin-top:15px;
  font-size:13px;
  opacity:0.7;
  color: #ffffffaa;
}

/* RESPONSIVE */
@media(max-width:520px){
  .register-card{
    width:90%;
    padding:35px 20px;
  }
  .row{
    flex-direction:column;
  }
}
</style>
</head>
<body>

<div class="register-card">
<h2><i class="fa-solid fa-user-plus"></i> Create Farmer Profile</h2>

<form method="POST" enctype="multipart/form-data">
  <div class="row">
    <div class="input-group">
      <input type="text" name="name" placeholder=" " required>
      <label>Farmer Name</label>
      <i class="fa-solid fa-user"></i>
    </div>
    <div class="input-group">
      <input type="text" name="phone" placeholder=" " required>
      <label>Phone Number</label>
      <i class="fa-solid fa-phone"></i>
    </div>
  </div>

  <div class="input-group">
    <textarea name="address" placeholder=" "></textarea>
    <label>product Address</label>
    <i class="fa-solid fa-location-dot"></i>
  </div>
<input type="hidden" name="latitude" id="lat">
<input type="hidden" name="longitude" id="lon">
  <div class="file-upload">
    <i class="fa-solid fa-cloud-arrow-up fa-2x"></i>
    <br>Click to Upload Photo
    <input type="file" name="photo" id="photo" accept="image/*" required>
    <img id="file-preview" alt="Preview">
  </div>

  <button type="submit">
    <i class="fa-solid fa-floppy-disk"></i> Create Profile
  </button>
</form>

<div class="footer">Farmer First Platform</div>
</div>

<script>
// File preview
const photoInput = document.getElementById('photo');
const preview = document.getElementById('file-preview');
photoInput.addEventListener('change', function(){
  const file = this.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = function(e){
      preview.src = e.target.result;
      preview.style.display='block';
    }
    reader.readAsDataURL(file);
  } else{
    preview.style.display='none';
  }
});
navigator.geolocation.getCurrentPosition((pos)=>{
    document.getElementById("lat").value = pos.coords.latitude;
    document.getElementById("lon").value = pos.coords.longitude;
});
</script>

</body>
</html>
